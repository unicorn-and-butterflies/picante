<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ultimate Product Tracker & Expense Dashboard</title>
    <style>
        /* Default Variables: Light Mode */
        :root {
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-muted: #475569;
            --border: #e2e8f0;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --table-header: #f1f5f9;
            --card-bg: #f1f5f9;
        }

        /* Dark Mode Theme */
        [data-theme="dark"] {
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --table-header: #0f172a;
            --card-bg: #0f172a;
        }

        /* Purple Light Theme */
        [data-theme="purple-light"] {
            --background: #faf5ff;
            --surface: #ffffff;
            --text: #3b0764;
            --text-muted: #6b21a8;
            --border: #e9d5ff;
            --primary: #8b5cf6;
            --primary-hover: #7c3aed;
            --table-header: #f3e8ff;
            --card-bg: #f3e8ff;
        }

        /* Purple Dark Theme */
        [data-theme="purple-dark"] {
            --background: #180828;
            --surface: #2e1065;
            --text: #f3e8ff;
            --text-muted: #c084fc;
            --border: #4c1d95;
            --primary: #a855f7;
            --primary-hover: #9333ea;
            --table-header: #180828;
            --card-bg: #180828;
        }

        /* Custom Theme Base slots */
        [data-theme="custom-light"] {
            --background: #f8fafc;
            --surface: #ffffff;
            --text: #1e293b;
            --text-muted: #475569;
            --border: #e2e8f0;
            --table-header: #f1f5f9;
            --card-bg: #f1f5f9;
        }
        [data-theme="custom-dark"] {
            --background: #0f172a;
            --surface: #1e293b;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
            --table-header: #0f172a;
            --card-bg: #0f172a;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            transition: background-color 0.3s, color 0.3s;
        }
        .container {
            width: 100%;
            max-width: 950px;
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            transition: background-color 0.3s, border-color 0.3s;
        }
        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        h1 {
            margin: 0;
            font-size: 1.75rem;
        }
        .theme-controls {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .picker-container {
            display: none;
            align-items: center;
            gap: 0.5rem;
        }
        input[type="color"] {
            padding: 0;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 2px solid var(--border);
            border-radius: 50%;
        }
        
        /* Form Layout styling */
        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }
        .form-grid input, .form-grid select, .form-grid button {
            width: 100%;
            box-sizing: border-box;
        }
        input, select, button {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 1rem;
            background-color: var(--surface);
            color: var(--text);
            transition: background-color 0.2s, border-color 0.2s;
        }
        button {
            background-color: var(--primary);
            color: white;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }
        button:hover {
            background-color: var(--primary-hover);
        }

        /* Summary Dashboard Row Card layout */
        .dashboard-summary {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }
        .summary-card {
            flex: 1;
            min-width: 200px;
            background-color: var(--card-bg);
            padding: 1rem 1.5rem;
            border-radius: 8px;
            box-shadow: inset 0 1px 2px rgb(0 0 0 / 0.05);
        }
        .summary-card label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .summary-card div {
            font-size: 1.5rem;
            font-weight: bold;
            margin-top: 0.25rem;
        }

        /* Data display list controls */
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .toggle-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        /* Table Layout */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            min-width: 600px;
        }
        th, td {
            padding: 1rem;
            border-bottom: 1px solid var(--border);
        }
        th {
            background-color: var(--table-header);
            color: var(--text-muted);
            font-weight: 600;
        }
        
        /* Category visual badges */
        .badge {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            border-radius: 4px;
            font-size: 0.85rem;
            font-weight: 500;
            background-color: var(--table-header);
            border: 1px solid var(--border);
        }
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 3rem;
        }
        .delete-btn {
            background-color: #ef4444;
            color: white;
            padding: 0.5rem 0.75rem;
            font-size: 0.875rem;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <!-- Header with complete Theme Management controls -->
    <div class="header-area">
        <h1>Product Purchase Tracker</h1>
        <div class="theme-controls">
            <label for="themeSelect">Theme: </label>
            <select id="themeSelect" onchange="handleThemeChange(this.value)">
                <option value="light">Light Mode</option>
                <option value="dark">Dark Mode</option>
                <option value="purple-light">Purple Light</option>
                <option value="purple-dark">Purple Dark</option>
                <option value="custom-light">Custom (Light)</option>
                <option value="custom-dark">Custom (Dark)</option>
            </select>
            
            <div id="pickerContainer" class="picker-container">
                <input type="color" id="colorPicker" value="#2563eb" oninput="applyCustomColor(this.value)">
            </div>
        </div>
    </div>
    
    <!-- Expanded Form Field Inputs Layout -->
    <div class="form-grid">
        <input type="text" id="productName" placeholder="Product Name (e.g. iPhone)" required>
        <input type="number" id="productPrice" placeholder="Price ($0.00)" step="0.01" min="0">
        <select id="productCategory">
            <option value="Electronics">Electronics</option>
            <option value="Home & Kitchen">Home & Kitchen</option>
            <option value="Clothing & Shoes">Clothing & Shoes</option>
            <option value="Groceries">Groceries</option>
            <option value="Automotive">Automotive</option>
            <option value="Other">Other Category</option>
        </select>
        <input type="date" id="purchaseDate" required>
        <button onclick="addProduct()">Add Product</button>
    </div>

    <!-- Active Summary Metrics Card Row Area -->
    <div class="dashboard-summary">
        <div class="summary-card">
            <label>Total Items Added</label>
            <div id="totalItemsCount">0</div>
        </div>
        <div class="summary-card">
            <label>Total Value Tracked</label>
            <div id="totalSpendValue">$0.00</div>
        </div>
    </div>

    <!-- Filters and Table Controls View Layout -->
    <div class="controls">
        <h3>Tracked Items</h3>
        <div class="toggle-container">
            <label for="unitToggle">Show age metrics in: </label>
            <select id="unitToggle" onchange="renderTable()">
                <option value="days">Days</option>
                <option value="months">Months</option>
            </select>
